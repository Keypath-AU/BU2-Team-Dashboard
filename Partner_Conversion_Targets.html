<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partner Conversion Targets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one control row above everything, summary tiles first, then the chart, then the detail table. */
:root{
  color-scheme: light;
  --bg:#f3f2ee; --card:#fcfcfb; --ink:#14130f; --ink2:#52514e; --ink3:#6f6d67;
  --line:#e0ded7; --grid:#ecebe6; --fcband:rgba(42,120,214,.06); --hover:#f1f0ec; --sel:#e8f0fb; --selink:#184f95;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --good:#0a7a0a; --bad:#d03b3b; --goodbg:#e4f3e4; --badbg:#fbe7e7; --flatbg:#ecebe6;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121211; --card:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --ink3:#8d8c85;
    --line:#2e2e2b; --grid:#262624; --fcband:rgba(57,135,229,.10); --hover:#232321; --sel:#1d2a3d; --selink:#9ec5f4;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
    --good:#4cc24c; --bad:#e66767; --goodbg:#16301a; --badbg:#3a1b1b; --flatbg:#262624;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121211; --card:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --ink3:#8d8c85;
  --line:#2e2e2b; --grid:#262624; --fcband:rgba(57,135,229,.10); --hover:#232321; --sel:#1d2a3d; --selink:#9ec5f4;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
  --good:#4cc24c; --bad:#e66767; --goodbg:#16301a; --badbg:#3a1b1b; --flatbg:#262624;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
body{padding:20px 16px 40px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--ink2);margin:4px 0 0;max-width:70ch}
.controls{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.ctl{display:flex;flex-direction:column;gap:5px}
.ctl>label,.ctl>.lab{font-size:11px;font-weight:500;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
select,input[type=number]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-height:34px}
select{min-width:230px}
input[type=number]{width:84px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{font:inherit;color:var(--ink2);background:var(--card);border:0;padding:7px 12px;cursor:pointer;min-height:34px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--selink);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.linkbtn{font:inherit;background:none;border:0;color:var(--selink);cursor:pointer;padding:0;text-decoration:underline;font-size:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{font:inherit;font-weight:500;color:var(--ink2);background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--s1)}
.tabs label.fcTick{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);cursor:pointer;padding:0 8px;align-self:center}
.tabs label.fcTick input{width:16px;height:16px;accent-color:var(--s7);cursor:pointer;margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:11px;font-weight:500;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .d{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.tile.hl{border-color:var(--s1);box-shadow:inset 3px 0 0 var(--s1)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h2{font-size:15px;font-weight:600;margin:0 0 2px}
.card .hint{color:var(--ink2);font-size:12.5px;margin:0 0 10px;max-width:80ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:6px 0 4px;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart:focus-visible{outline:2px solid var(--s1);outline-offset:3px;border-radius:6px}
.tt{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.14);font-size:12px;min-width:170px;max-width:290px;z-index:5;display:none}
.tt .h{font-weight:600;margin-bottom:5px;color:var(--ink)}
.tt .r{display:flex;align-items:center;gap:7px;padding:1.5px 0}
.tt .r b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);min-width:50px}
.tt .r span{color:var(--ink2)}
.key{display:inline-block;width:14px;height:0;border-top:3px solid;flex:none}
.key.dash{border-top-style:dashed;border-top-width:2px}
.dia{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.wide{min-width:900px}
td:first-child{min-width:150px}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:10.5px;font-weight:500;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;background:var(--card)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--hover)}
tr.total td{font-weight:600;border-top:1px solid var(--ink3)}
.scroll{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px}
.pill.up{background:var(--goodbg);color:var(--good)}
.pill.down{background:var(--badbg);color:var(--bad)}
.pill.flat{background:var(--flatbg);color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.chip{font:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:4px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--selink);border-color:var(--s1)}
.chip:disabled{opacity:.45;cursor:not-allowed}
details{margin-top:10px}
summary{cursor:pointer;color:var(--ink2);font-size:12.5px}
.note{font-size:12px;color:var(--ink2);margin:8px 0 0;max-width:95ch}
.call{border-left:3px solid var(--s1);padding:6px 12px;background:var(--sel);color:var(--ink);border-radius:0 8px 8px 0;margin:8px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.two{grid-template-columns:1fr} select{min-width:0;width:100%} .ctl{flex:1 1 140px}}
svg text{font-family:var(--font)}
@media (prefers-reduced-motion:no-preference){.tile,.card{transition:border-color .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Partner conversion targets</h1>
    <p class="sub">Eligible-pool conversion from SB6 2025 to SB6 2026 by partner and program, with the SB1 2027 forecast from the four target methods. The forecast uses the eligible pool as at 16 November 2026, before census.</p>
  </header>

  <section class="controls" aria-label="Filters">
    <div class="ctl"><label for="partner">Partner</label>
      <select id="partner"></select></div>
    <div class="ctl" id="basisCtl"><span class="lab">Count</span>
      <div class="seg" role="group" aria-label="Count basis">
        <button type="button" data-basis="e" aria-pressed="true">Enrolments</button>
        <button type="button" data-basis="u" aria-pressed="false">Unique students</button>
      </div></div>
    <div class="ctl" id="segCtl"><span class="lab">Students</span>
      <div class="seg" role="group" aria-label="Student segment">
        <button type="button" data-seg="all" aria-pressed="true">All</button>
        <button type="button" data-seg="rego" aria-pressed="false">Registration</button>
        <button type="button" data-seg="reeng" aria-pressed="false">Re-engagement</button>
      </div></div>
    <div class="ctl" id="adjCtl"><label for="adj">Seasonal shade (pts)</label>
      <div style="display:flex;gap:8px;align-items:center"><input type="number" id="adj" step="0.1" min="0" max="10"><button type="button" class="linkbtn" id="adjReset">Reset</button></div></div>
  </section>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" data-tab="overall" aria-selected="true">Overall rate</button>
    <button role="tab" data-tab="programs" aria-selected="false">Program trends</button>
    <button role="tab" data-tab="single" aria-selected="false">Single program</button>
    <button role="tab" data-tab="season" aria-selected="false">Seasonality</button>
    <button role="tab" data-tab="targets" aria-selected="false">Targets</button>
    <button role="tab" data-tab="trend" aria-selected="false">Trend</button>
    <label class="fcTick" title="Plots the SB1 2027 forecast from the Overall rate tab (black dot, after the seasonal shade) on the Trend and Seasonality graphs"><input type="checkbox" id="fcTick"> Show SB1 forecast</label>
    <!-- Adviser targets tab hidden for now: <button role="tab" data-tab="advisers" aria-selected="false">Adviser targets (ECU preview)</button> -->
  </nav>

  <main id="view"></main>

  <p class="note" id="footnote"></p>
</div>

function spark(vals,w=92,h=26){
  const v=vals.filter(x=>x!=null); const svg=S('svg',{viewBox:`0 0 ${w} ${h}`,width:w,height:h,'aria-hidden':'true'});
  if(v.length<2) return svg;
  const lo=Math.min(...v),hi=Math.max(...v),r=(hi-lo)||1; const px=i=>3+i*(w-6)/(vals.length-1), py=x=>h-4-(x-lo)/r*(h-8);
  let d='',last=null; vals.forEach((x,i)=>{if(x==null)return;d+=(d?'L':'M')+px(i)+' '+py(x)+' ';last=[px(i),py(x)]});
  svg.appendChild(S('path',{d,fill:'none',style:'stroke:var(--s1);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round'}));
  if(last) svg.appendChild(S('circle',{cx:last[0],cy:last[1],r:3,style:'fill:var(--s1);stroke:var(--card);stroke-width:1.5'}));

function barChart(host,items){
  host.innerHTML=''; const W=Math.max(300,host.clientWidth||700), Ht=250, m={l:44,r:16,t:20,b:40};
  const pw=W-m.l-m.r, ph=Ht-m.t-m.b, n=items.length, bw=Math.min(54,pw/n*.6);
  const vs=items.map(i=>i.value); let lo=Math.min(0,...vs), hi=Math.max(0,...vs); const pad=(hi-lo)*.15||1; lo-=pad; hi+=pad; const ts=(hi-lo)>14?5:(hi-lo)>7?2:1; lo=Math.floor(lo/ts)*ts; hi=Math.ceil(hi/ts)*ts;
  const Y=v=>m.t+ph-(v-lo)/(hi-lo)*ph, X=i=>m.l+pw/n*(i+.5);
  const svg=S('svg',{viewBox:`0 0 ${W} ${Ht}`,role:'img','aria-label':'SB6 to SB1 change by year'});
  for(let v=lo;v<=hi+1e-9;v+=ts){svg.appendChild(S('line',{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),style:`stroke:${v===0?'var(--ink3)':'var(--grid)'};stroke-width:1`}));svg.appendChild(S('text',{x:m.l-8,y:Y(v)+4,'text-anchor':'end',style:'fill:var(--ink3);font-size:11px'},(v>0?'+':v<0?'−':'')+Math.abs(v)))}
  const tt=H('div',{class:'tt'});
  items.forEach((it,i)=>{
    const y0=Y(0), y1=Y(it.value), top=Math.min(y0,y1), h=Math.max(2,Math.abs(y1-y0));
    const r=S('rect',{x:X(i)-bw/2,y:top,width:bw,height:h,rx:3,style:`fill:${it.value>=0?'var(--s1)':'var(--s8)'}`});
    svg.appendChild(r);
    svg.appendChild(S('text',{x:X(i),y:it.value>=0?top-6:top+h+13,'text-anchor':'middle',style:'fill:var(--ink);font-size:11.5px;font-weight:600'},sg(it.value)));
    svg.appendChild(S('text',{x:X(i),y:Ht-m.b+18,'text-anchor':'middle',style:'fill:var(--ink2);font-size:11px'},it.label));
    const hit=S('rect',{x:X(i)-pw/n/2,y:m.t,width:pw/n,height:ph,fill:'transparent'});
    hit.style.cursor='pointer'; hit.addEventListener('click',()=>{if(tt.style.display==='block'&&tt.dataset.i===String(i)){tt.style.display='none';return} tt.dataset.i=i;tt.innerHTML='';tt.appendChild(Object.assign(H('div',{class:'h'}),{textContent:it.label}));const row=H('div',{class:'r'});row.appendChild(Object.assign(H('b'),{textContent:sg(it.value)+' pts'}));row.appendChild(Object.assign(H('span'),{textContent:it.detail}));tt.appendChild(row);tt.style.display='block';let l=X(i)+16;if(l+200>host.clientWidth)l=X(i)-210;tt.style.left=Math.max(4,l)+'px';tt.style.top='10px'});
    svg.appendChild(hit);
  });
  svg.addEventListener('click',e=>{if(e.target===svg)tt.style.display='none'});
  host.appendChild(svg); host.appendChild(tt);
}

const PROPCOL = 'var(--s7)';
function propInfo(){ if(!ST.showFc) return null; const f=P().fc.e, pool=f.pool, adj=ST.adj[ST.partner]||0, r=Math.max(0,f.roll/pool*100-adj); return {n:r/100*pool,pool,r}; }
function propConnect(i,y,show){const q=propInfo(); return (show&&q&&y!=null)?[{x1:i,y1:y,x2:i+1,y2:q.r,color:'var(--ink3)',dash:'6 4'}]:[]}
function propMarkers(show){const q=propInfo(); if(!show||!q) return []; return [{shape:'pt',y:q.r,color:PROPCOL,name:'SB1 2027 forecast',detail:fmt(q.n)+' enrolments of a pool of '+fmt(q.pool)+'. Overall rate forecast after the seasonal shade.',label:pc(q.r)}]}
function linfit(ys){
  const xs=[],vs=[]; ys.forEach((y,i)=>{if(y!=null){xs.push(i);vs.push(y)}});
  const n=xs.length; if(n<4) return null;
  const mx=xs.reduce((a,b)=>a+b)/n, my=vs.reduce((a,b)=>a+b)/n; let sxy=0,sxx=0,syy=0;
  xs.forEach((x,i)=>{sxy+=(x-mx)*(vs[i]-my);sxx+=(x-mx)*(x-mx);syy+=(vs[i]-my)*(vs[i]-my)});
  const b=sxy/sxx; return {a:my-b*mx,b,n,r2:syy>0?sxy*sxy/(sxx*syy):0};
}
function viewTrend(root){
  const p=P(), Sx=p.seasonal, metric=ST.sMetric, labels=Sx.labels, n=labels.length, raw=Sx[metric];
  const anom=ST.partner==='UC'?labels.indexOf('SB4 2023'):-1;
  const v=raw.map((x,i)=>i===anom?null:x);                       // anomaly left out of every calculation
  const start=ST.tWin>0?Math.max(0,n-ST.tWin):0;
  const fit=linfit(v.map((x,i)=>i>=start?x:null));
  const trend=labels.map((_,i)=>(fit&&i>=start)?fit.a+fit.b*i:null);
  const roll=labels.map((_,i)=>{ if(i<5) return null; const w=v.slice(i-5,i+1).filter(x=>x!=null); return w.length>=5?w.reduce((a,b)=>a+b)/w.length:null; });
  const isP=(i,t)=>labels[i].startsWith(t);

  // controls
  const mc=H('div',{class:'controls'});
  const seg_=(lab,opts,cur,set)=>{const w=H('div',{class:'ctl'}); w.appendChild(Object.assign(H('span',{class:'lab'}),{textContent:lab})); const g=H('div',{class:'seg'}); opts.forEach(([k,t])=>{const b=H('button',{type:'button','aria-pressed':String(cur===k)});b.textContent=t;b.addEventListener('click',()=>{set(k);render()});g.appendChild(b)}); w.appendChild(g); return w;};
  mc.appendChild(seg_('Conversion measure',[['elig','Eligible pool'],['total','Total pool']],metric,k=>{ST.sMetric=k}));
  mc.appendChild(seg_('Trend window',[[0,'All history'],[12,'Last 2 years']],ST.tWin,k=>{ST.tWin=k}));
  mc.appendChild(Object.assign(H('p',{class:'note',style:'margin:0;align-self:center'}),{textContent:'Reported conversion from your sheets, '+labels[0]+' to '+labels[n-1]+'. The count and student filters do not apply here.'}));
  root.appendChild(mc);

  // seasonal index by teaching period (full years only)
  const y0=+labels[0].split(' ')[1], yrs=[];
  for(let y=y0+1;y<=2026;y++){const ix=[1,2,3,4,5,6].map(k=>labels.indexOf('SB'+k+' '+y)); if(ix.every(i=>i>=0)) yrs.push({y,ix});}
  const tp=[0,1,2,3,4,5].map(k=>({name:'SB'+(k+1),vals:[],devs:[],best:0,worst:0,cnt:0}));
  yrs.forEach(Y=>{
    const vs=Y.ix.map(i=>v[i]), ok=vs.filter(x=>x!=null), avg=ok.reduce((a,b)=>a+b)/ok.length, mx=Math.max(...ok), mn=Math.min(...ok);
    vs.forEach((x,k)=>{ if(x==null) return; tp[k].vals.push(x); tp[k].devs.push(x-avg); tp[k].cnt++; if(x===mx) tp[k].best++; if(x===mn) tp[k].worst++; });
  });
  tp.forEach(t=>{t.avg=t.vals.reduce((a,b)=>a+b,0)/t.vals.length; t.idx=t.devs.reduce((a,b)=>a+b,0)/t.devs.length;});
  const ranked=tp.slice().sort((a,b)=>b.idx-a.idx), bestT=ranked[0], worstT=ranked[5];

  // tiles
  const last=raw[n-1], tl=trend[n-1], yo=(roll[n-1]!=null&&roll[n-7]!=null)?roll[n-1]-roll[n-7]:null;
  const tiles=H('div',{class:'tiles'});
  tiles.appendChild(fit?tile('Trend, '+(ST.tWin?'last '+(ST.tWin/6)+' years':'all history'),sg(fit.b*6)+' pts a year','across '+fit.n+' periods, R² '+fit.r2.toFixed(2),true):tile('Trend','–','too few periods'));
  tiles.appendChild(tile('Latest against trend',tl!=null?sg(last-tl)+' pts':'–',labels[n-1]+' at '+pc(last)+' against '+pc(tl)));
  tiles.appendChild(tile('Strongest period',bestT.name,sg(bestT.idx)+' pts against its year, top in '+bestT.best+' of '+bestT.cnt+' years'));
  tiles.appendChild(tile('Weakest period',worstT.name,sg(worstT.idx)+' pts against its year, bottom in '+worstT.worst+' of '+worstT.cnt+' years'));
  tiles.appendChild(tile('Year on year, 6-period average',yo!=null?sg(yo)+' pts':'–',pc(roll[n-1])+' now against '+pc(roll[n-7])+' a year ago'));
  { const q=propInfo(); if(metric==='elig'&&q&&fit){ const tr=fit.a+fit.b*n; tiles.appendChild(tile('SB1 2027 forecast',pc(q.r),fmt(q.n)+' enrolments, '+sg(q.r-tr)+' pts against the trend line ('+pc(tr)+')')); } }
  root.appendChild(tiles);

  // main chart
  const c=card('Conversion trend','The seasonality line with a linear trend and a six-period moving average. Six periods is one full year, so the seasonal swing cancels out and the moving average shows the underlying direction.');
  c.appendChild(legend([{t:'line',color:'var(--ink3)',name:'Conversion by period'},{t:'line',color:'var(--s3)',name:'6-period moving average'},{t:'line',color:'var(--s1)',dash:true,name:'Linear trend'}].concat((metric==='elig'&&ST.showFc)?[{t:'pt',color:PROPCOL,name:'SB1 2027 forecast (Overall rate, after seasonal shade)'}]:[])));
  const host=H('div',{class:'chart'}); c.appendChild(host);
  const ser=[
    {name:(metric==='elig'?'Eligible':'Total')+'-pool conversion',color:'var(--ink3)',w:1.6,vals:raw.concat([null]),markerFn:i=>{ if(i===anom) return {r:5,fill:'var(--s2)',hollow:true}; return {r:3.6,fill:'var(--ink3)'} }},
    {name:'6-period moving average',color:'var(--s3)',w:2.6,vals:roll.concat([null]),markerFn:()=>null},
    {name:'Linear trend',color:'var(--s1)',w:2,dash:true,vals:trend.concat([fit?fit.a+fit.b*n:null]),markerFn:()=>null}
  ];
  const draw=()=>lineChart(host,{labels:labels.concat(['SB1 2027']),fcIndex:n,noBand:true,connect:propConnect(n-1,raw[n-1],metric==='elig'),series:ser,markers:propMarkers(metric==='elig'),endLabels:false,title:p.name+' conversion trend',height:340,xLabel:i=>(i===n||isP(i,'SB1'))?(i===n?'2027':labels[i].split(' ')[1]):''});
  root._draws.push(draw); root.appendChild(c); draw();
  if(anom>=0) c.appendChild(Object.assign(H('p',{class:'note'}),{textContent:'The hollow orange ring is SB4 2023, about 15 points above its neighbours. It looks like a data or pool anomaly, so it is left out of the trend, moving average and period averages.'}));
  c.appendChild(dataDetails(['Period','Conversion','6-period average','Trend line'],labels.map((l,i)=>[l,pc(raw[i]),pc(roll[i]),pc(trend[i])])));
  const cl=H('p',{class:'call'});
  cl.textContent=ST.partner+': '+(fit?'conversion is '+(Math.abs(fit.b*6)<0.3?'broadly flat':(fit.b>0?'rising':'falling')+' by about '+Math.abs(fit.b*6).toFixed(1)+' pts a year')+' over '+(ST.tWin?'the last '+(ST.tWin/6)+' years':'the full history')+'. ':'Not enough periods for a trend. ')+bestT.name+' is the strongest period ('+sg(bestT.idx)+' pts against its year) and '+worstT.name+' the weakest ('+sg(worstT.idx)+' pts).';
  c.appendChild(cl);

  // seasonal index
  const b=card('Which teaching periods perform best','Average gap between each teaching period and the average of its own year, over '+yrs.length+' full years ('+yrs[0].y+' to '+yrs[yrs.length-1].y+'). Blue is above the year average, red below.');
  const bh=H('div',{class:'chart'}); b.appendChild(bh);
  const bd=()=>barChart(bh,tp.map(t=>({label:t.name,value:t.idx,detail:'average '+t.avg.toFixed(1)+'%, top in '+t.best+' of '+t.cnt+' years'})));
  root._draws.push(bd); root.appendChild(b); bd();
  b.appendChild(tableFrom(['Period','Average conversion','Against its year','Top period in','Bottom period in'],ranked.map(t=>[t.name,pc(t.avg),sg(t.idx)+' pts',t.best+' of '+t.cnt+' years',t.worst+' of '+t.cnt+' years'])));

  // same period, year on year
  const ys=[2023,2024,2025,2026].filter(y=>labels.indexOf('SB1 '+y)>=0);
  const yc=card('Same period, year on year','Each teaching period against the same period in earlier years. The last column is the latest year against the year before.');
  const idx=(k,y)=>labels.indexOf('SB'+k+' '+y);
  const rows=[1,2,3,4,5,6].map(k=>{
    const cells=ys.map(y=>{const i=idx(k,y); return i<0?'–':pc(raw[i])+(i===anom?'*':'')});
    const a=idx(k,2026), z=idx(k,2025), d=(a>=0&&z>=0&&v[a]!=null&&v[z]!=null)?sg(v[a]-v[z])+' pts':'–';
    return ['SB'+k].concat(cells,[d]);
  });
  const avgY=y=>{const w=[1,2,3,4,5,6].map(k=>v[idx(k,y)]).filter(x=>x!=null); return w.length?w.reduce((a,b)=>a+b)/w.length:null};
  rows.push(['Year average'].concat(ys.map(y=>pc(avgY(y))),[(avgY(2026)!=null&&avgY(2025)!=null)?sg(avgY(2026)-avgY(2025))+' pts':'–']));
  yc.appendChild(tableFrom(['Period'].concat(ys.map(String),[ '2026 vs 2025']),rows));
  if(anom>=0) yc.appendChild(Object.assign(H('p',{class:'note'}),{textContent:'* SB4 2023 is the anomaly and is left out of the year average.'}));
  root.appendChild(yc);

  // ideas
  const ic=card('Ideas to review together','What is already on this tab, and what we could add. Tell me which of the proposed ones you want and I will build them. Several are common in enrolment, retention and operational dashboards.');
  const items=[
    ['On this tab','Linear trend with R² and a choice of window','Shows the direction over all history, four years or two years, and whether the latest period sits above or below it.'],
    ['On this tab','Six-period moving average','One full year of teaching periods, so seasonality drops out. A standard way to read underlying direction.'],
    ['On this tab','Seasonal index by teaching period','Each period against the average of its own year, with how often it is the best or worst. Classical seasonal decomposition in its simplest form.'],
    ['On this tab','Same period, year on year','Compares each period with the same period a year earlier, the usual "same period last year" view.'],
    ['Proposed','Control chart bands','A band of plus or minus two standard deviations around the trend, to separate real movement from normal noise (for example ECU SB4 2026 or UC SB4 2023).'],
    ['Proposed','Target attainment trend','Share of periods where actual met the target, and the average gap over time, using the targets already loaded on the Targets tab.'],
    ['Proposed','Heatmap of period by year','A grid of teaching period against year, coloured by conversion against its year average. Quick to scan for patterns.'],
    ['Proposed','Pool size against conversion','Does a bigger eligible pool convert at a lower rate? Uses the pools you supplied.'],
    ['Proposed','Registration against re-engagement trend','Shows which segment is driving a change. Only the last seven periods have segment data.'],
    ['Proposed','Program mix against rate','Splits a change into mix shift between programs and real rate change. Same seven-period limit.'],
    ['Proposed','Seasonal forecast with a range','A Holt-Winters style forecast for SB1 2027 with an 80% range, set beside the four methods on the Overall tab.'],
    ['Proposed','Partners on one chart, indexed','All three partners rebased to a common starting point so trends compare fairly.'],
    ['Proposed','External benchmark line','A sector retention or attrition reference line, if we agree a source worth benchmarking against.']
  ];
  items.forEach(([st,t,d])=>{
    const r=H('div',{style:'display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)'});
    const pl=H('span',{class:'pill '+(st==='On this tab'?'up':'flat'),style:'flex:none;min-width:96px;justify-content:center'}); pl.textContent=st;
    const tx=H('div'); const t1=H('div',{style:'font-weight:600'}); t1.textContent=t; const t2=H('div',{style:'color:var(--ink2);font-size:12.5px'}); t2.textContent=d;
    tx.appendChild(t1); tx.appendChild(t2); r.appendChild(pl); r.appendChild(tx); ic.appendChild(r);
  });
  root.appendChild(ic);
}

/* ---------- adviser targets (preview) ---------- */
const ADV_ECU=[['Mia Yourn',170],['Sofie Katsipodas',148],['Lily Graciano',150],['Nova Brownlie',150],['Katina Astles',152],['Nequila Vincent',150]];
function viewAdvisers(root){
  const card=document.createElement('div');
  card.style.cssText='background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-width:520px';
  let rows=ADV_ECU.map(a=>'<tr><td style="padding:9px 10px;border-top:1px solid var(--line)">'+a[0]+'</td><td style="padding:9px 10px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;font-weight:600">'+a[1]+'</td></tr>').join('');
  card.innerHTML='<h2 style="font-size:16px;font-weight:600;margin:0 0 2px">ECU adviser targets</h2><p style="color:var(--ink2);margin:0 0 10px;font-size:13px">Preview. Shows the first six advisers only; the list will be completed when the full set is supplied.</p><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:8px 10px;font-size:11px;font-weight:500;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em">Adviser</th><th style="text-align:right;padding:8px 10px;font-size:11px;font-weight:500;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em">Target</th></tr></thead><tbody>'+rows+'</tbody></table>';
  root.appendChild(card);
}

/* ---------- shell ---------- */
function render(){
  const root=$('#view'); root._draws=[]; root.innerHTML='';
  document.querySelectorAll('[data-basis]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.basis===ST.basis)));
  document.querySelectorAll('[data-seg]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.seg===ST.seg)));
  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===ST.tab)));
  $('#adj').value=(ST.adj[ST.partner]||0).toFixed(1);
  $('#fcTick').checked=ST.showFc;
  const showBS=!['season','single','advisers','targets','trend'].includes(ST.tab), showSeg=!['season','single','advisers','targets','trend'].includes(ST.tab);
  $('#segCtl').style.display=showSeg?'':'none'; $('#basisCtl').style.display=(ST.tab==='season'||ST.tab==='advisers'||ST.tab==='targets'||ST.tab==='trend')?'none':'';
  $('#adjCtl').style.display=(ST.tab==='targets'||ST.tab==='trend')?'none':'';
  ({overall:viewOverall,programs:viewPrograms,single:viewSingle,season:viewSeason,targets:viewTargets,trend:viewTrend,advisers:viewAdvisers})[ST.tab](root);
  const p=P();
  $('#footnote').textContent='Sources: census cohort files SB6 2025 to SB6 2026 and your re-enrolment actuals for '+p.name+'; SB1 2027 pool from the BU2 Eligible Pool View of 16 Nov 2026. Eligible pool excludes Next Term Sub Status "No Course Available" and Next Term Enrollment Status Graduated or Withdrawn. Registration is Enrolled before the term. The enrolment-basis split by segment is estimated by applying each program’s enrolments-per-student multiple to both segments. Forecasts are initial estimates, not the final target.';
}
let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const r=$('#view'); (r._draws||[]).forEach(f=>f())},120)});
(function init(){
  const sel=$('#partner'); Object.keys(D.partners).forEach(k=>{const o=H('option',{value:k});o.textContent=D.partners[k].name;if(k===ST.partner)o.selected=true;sel.appendChild(o)});
  sel.addEventListener('change',()=>{ST.partner=sel.value;ST.sel=[];ST.prog=null;render()});
  document.querySelectorAll('[data-basis]').forEach(b=>b.addEventListener('click',()=>{ST.basis=b.dataset.basis;render()}));
  document.querySelectorAll('[data-seg]').forEach(b=>b.addEventListener('click',()=>{ST.seg=b.dataset.seg;render()}));
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{ST.tab=b.dataset.tab;render()}));
  $('#adj').addEventListener('change',e=>{const v=parseFloat(e.target.value);ST.adj[ST.partner]=isFinite(v)?Math.max(0,Math.min(10,v)):0;render()});
  $('#adjReset').addEventListener('click',()=>{ST.adj[ST.partner]=P().adj;render()});
  $('#fcTick').addEventListener('change',e=>{ST.showFc=e.target.checked;render()});
  const h=location.hash.replace('#',''); if(['overall','programs','single','season','targets','trend'].includes(h)) ST.tab=h;
  render();
})();
</script>
